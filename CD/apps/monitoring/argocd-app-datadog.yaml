apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datadog
  namespace: argocd
spec:
  project: argocd
  source:
    repoURL: https://helm.datadoghq.com
    chart: datadog
    targetRevision: "3.69.0"
    helm:
      valueFiles:
        - values/datadog-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: datadog
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
