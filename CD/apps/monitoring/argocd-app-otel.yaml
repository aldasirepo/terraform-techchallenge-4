apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
spec:
  project: argocd
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.90.1"
    helm:
      values: |
        mode: deployment
        replicaCount: 1
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318
          processors:
            batch:
              timeout: 5s
              send_batch_size: 1000
            memory_limiter:
              limit_mib: 200
              spike_limit_mib: 50
          exporters:
            prometheusremotewrite:
              endpoint: "http://prometheus-operated.monitoring.svc:9090/api/v1/write"
            loki:
              endpoint: "http://loki.monitoring.svc:3100/loki/api/v1/push"
            datadog:
              api:
                key: ${DD_API_KEY}
                site: "datadoghq.com"
            logging:
              verbosity: normal
          service:
            pipelines:
              metrics:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [prometheusremotewrite, datadog]
              logs:
                receivers: [otlp]
                processors: [batch]
                exporters: [loki, datadog]
              traces:
                receivers: [otlp]
                processors: [batch]
                exporters: [datadog]
        ports:
          otlp:
            enabled: true
            containerPort: 4317
            servicePort: 4317
            protocol: TCP
          otlp-http:
            enabled: true
            containerPort: 4318
            servicePort: 4318
            protocol: TCP
        extraEnvs:
          - name: DD_API_KEY
            valueFrom:
              secretKeyRef:
                name: datadog-secret
                key: api-key
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
