datadog:
  apiKeyExistingSecret: datadog-secret
  apiKeyExistingSecretKey: api-key
  site: "datadoghq.com"

  apm:
    portEnabled: true
    port: 8126

  logs:
    enabled: true
    containerCollectAll: true

  otlp:
    receiver:
      protocols:
        grpc:
          enabled: true
          endpoint: "0.0.0.0:4317"
        http:
          enabled: true
          endpoint: "0.0.0.0:4318"

  tags:
    - "env:prod"
    - "project:togglemaster"
    - "cluster:togglemaster-eks"

  kubelet:
    tlsVerify: false

clusterAgent:
  enabled: true
  metricsProvider:
    enabled: true

agents:
  useHostNetwork: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi
