mode: deployment
replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 5s
      send_batch_size: 1000
    memory_limiter:
      limit_mib: 200
      spike_limit_mib: 50

  exporters:
    prometheusremotewrite:
      endpoint: "http://prometheus-operated.monitoring.svc:9090/api/v1/write"
    loki:
      endpoint: "http://loki.monitoring.svc:3100/loki/api/v1/push"
    datadog:
      api:
        key: ${DD_API_KEY}
        site: "datadoghq.com"
    logging:
      verbosity: normal

  service:
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [prometheusremotewrite, datadog]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [loki, datadog]
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [datadog]

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

# Injeta a API key do secret no OTel Collector
extraEnvs:
  - name: DD_API_KEY
    valueFrom:
      secretKeyRef:
        name: datadog-secret
        key: api-key
        namespace: datadog
