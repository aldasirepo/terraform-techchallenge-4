name: Terraform Apply

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'environments/prod/**'
      - 'modules/**'

env:
  AWS_REGION: us-east-1
  WORK_DIR: environments/prod/
  CLUSTER_NAME: togglemaster-eks

jobs:
  terraform-apply:
    name: Terraform Apply Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Terraform Init
        working-directory: ${{ env.WORK_DIR }}
        run: terraform init -upgrade

      - name: Terraform Apply - AWS Infrastructure
        working-directory: ${{ env.WORK_DIR }}
        run: |
          terraform apply -auto-approve \
            -var="rds_password=${{ secrets.RDS_PASSWORD }}" \
            --var-file=terraform.tfvars \
            -target=module.vpc \
            -target=module.eks \
            -target=module.rds \
            -target=module.sqs \
            -target=module.ecr \
            -target=module.resources \
            -target=module.databases || true

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          kubectl get nodes

      - name: Terraform Apply - Kubernetes Resources
        working-directory: ${{ env.WORK_DIR }}
        run: terraform apply -auto-approve -var="rds_password=${{ secrets.RDS_PASSWORD }}" --var-file=terraform.tfvars

      - name: Fix Loki isDefault datasource
        run: |
          echo "Aguardando Loki subir..."
          sleep 60
          kubectl patch configmap loki-loki-stack -n monitoring --type merge -p             '{"data":{"loki-stack-datasource.yaml":"apiVersion: 1\ndatasources:\n- name: Loki\n  type: loki\n  access: proxy\n  url: \"http://loki:3100\"\n  version: 1\n  isDefault: false\n  jsonData:\n    {}\n"}}' || true
          kubectl delete pod -n monitoring -l app.kubernetes.io/name=grafana || true
          echo "✅ Loki datasource corrigido!" 

      - name: Install Ingress NGINX
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.6/deploy/static/provider/cloud/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=120s || true

      - name: Install Sealed Secrets
        run: |
          helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
          helm repo update
          helm upgrade --install sealed-secrets sealed-secrets/sealed-secrets \
            -n sealed-secrets --create-namespace --wait

      - name: Apply ArgoCD Apps
        run: |
          kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=180s || true
          kubectl apply --server-side --force-conflicts -k CD/apps/

      - name: Get Terraform Outputs
        id: tf-outputs
        working-directory: ${{ env.WORK_DIR }}
        run: |
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT
          echo "redis_endpoint=$(terraform output -raw redis_endpoint)" >> $GITHUB_OUTPUT
          echo "sqs_url=$(terraform output -raw sqs_queue_url)" >> $GITHUB_OUTPUT

      - name: Encode RDS Password
        id: rds-password
        run: |
          RDS_PASS="${{ secrets.RDS_PASSWORD }}"
          RDS_PASS_ENCODED=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$RDS_PASS")
          echo "rds_password=$RDS_PASS" >> $GITHUB_OUTPUT
          echo "rds_password_encoded=$RDS_PASS_ENCODED" >> $GITHUB_OUTPUT

      - name: Create Datadog K8s Secrets
        run: |
          kubectl create namespace datadog --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic datadog-secret \
            --from-literal=api-key=${{ secrets.DD_API_KEY }} \
            -n datadog --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic datadog-secret \
            --from-literal=api-key=${{ secrets.DD_API_KEY }} \
            -n monitoring --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Grafana Secrets
        run: |
          kubectl create secret generic grafana-secrets \
            --from-literal=SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }} \
            -n monitoring --dry-run=client -o yaml | kubectl apply -f -

          echo "✅ Grafana secrets criados!"

      - name: Apply Grafana Provisioning
        run: |
          kubectl apply -f CD/apps/monitoring/grafana-provisioning-configmap.yaml
          kubectl apply -f CD/apps/monitoring/togglemaster-dashboard-configmap.yaml
          echo "✅ Grafana provisioning aplicado!"

      - name: Create Microservices K8s Secrets
        run: |
          RDS_ENDPOINT="${{ steps.tf-outputs.outputs.rds_endpoint }}"
          REDIS_ENDPOINT="${{ steps.tf-outputs.outputs.redis_endpoint }}"
          SQS_URL="${{ steps.tf-outputs.outputs.sqs_url }}"
          RDS_PASS="${{ steps.rds-password.outputs.rds_password }}"
          RDS_PASS_ENCODED="${{ steps.rds-password.outputs.rds_password_encoded }}"

          # auth-service
          kubectl create secret generic auth-service-db-secret \
            --from-literal=POSTGRES_USER=togglemaster_admin \
            --from-literal=POSTGRES_PASSWORD="$RDS_PASS" \
            --from-literal=POSTGRES_DB=togglemaster \
            --from-literal=POSTGRES_PORT=5432 \
            --from-literal=MASTER_KEY=masterkey123 \
            --from-literal=DATABASE_URL="postgres://togglemaster_admin:${RDS_PASS_ENCODED}@${RDS_ENDPOINT}/togglemaster?sslmode=require" \
            -n auth-service --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic auth-service-db-secret-host \
            --from-literal=POSTGRES_HOST="$RDS_ENDPOINT" \
            -n auth-service --dry-run=client -o yaml | kubectl apply -f -

          # flag-service
          kubectl create secret generic flag-service-db-secret \
            --from-literal=POSTGRES_USER=togglemaster_admin \
            --from-literal=POSTGRES_PASSWORD="$RDS_PASS" \
            --from-literal=POSTGRES_DB=togglemaster \
            --from-literal=POSTGRES_PORT=5432 \
            --from-literal=AUTH_SERVICE_URL=http://app-auth-service.auth-service.svc.cluster.local:8001 \
            --from-literal=DATABASE_URL="postgres://togglemaster_admin:${RDS_PASS_ENCODED}@${RDS_ENDPOINT}/togglemaster?sslmode=require" \
            -n flag-service --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic flag-service-db-secret-host \
            --from-literal=POSTGRES_HOST="$RDS_ENDPOINT" \
            -n flag-service --dry-run=client -o yaml | kubectl apply -f -

          # targeting-service
          kubectl create secret generic targeting-service-db-secret \
            --from-literal=POSTGRES_USER=togglemaster_admin \
            --from-literal=POSTGRES_PASSWORD="$RDS_PASS" \
            --from-literal=POSTGRES_DB=togglemaster \
            --from-literal=POSTGRES_PORT=5432 \
            --from-literal=AUTH_SERVICE_URL=http://app-auth-service.auth-service.svc.cluster.local:8001 \
            --from-literal=DATABASE_URL="postgres://togglemaster_admin:${RDS_PASS_ENCODED}@${RDS_ENDPOINT}/togglemaster?sslmode=require" \
            -n targeting-service --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic targeting-service-db-secret-host \
            --from-literal=POSTGRES_HOST="$RDS_ENDPOINT" \
            -n targeting-service --dry-run=client -o yaml | kubectl apply -f -

          # evaluation-service
          kubectl create secret generic evaluation-service-db-secret \
            --from-literal=REDIS_URL="redis://${REDIS_ENDPOINT}:6379" \
            --from-literal=FLAG_SERVICE_URL=http://app-flag-service.flag-service.svc.cluster.local:8002 \
            --from-literal=TARGETING_SERVICE_URL=http://app-targeting-service.targeting-service.svc.cluster.local:8003 \
            --from-literal=AWS_SQS_URL="$SQS_URL" \
            --from-literal=AWS_REGION=us-east-1 \
            --from-literal=SERVICE_API_KEY=${{ secrets.SERVICE_API_KEY }} \
            -n evaluation-service --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic evaluation-service-db-secret-host \
            --from-literal=REDIS_URL="redis://${REDIS_ENDPOINT}:6379" \
            --from-literal=AWS_REGION=us-east-1 \
            --from-literal=AWS_SQS_URL="$SQS_URL" \
            -n evaluation-service --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic shared-api-key \
            --from-literal=SERVICE_API_KEY=${{ secrets.SERVICE_API_KEY }} \
            -n evaluation-service --dry-run=client -o yaml | kubectl apply -f -

          # analytics-service
          kubectl create secret generic analytics-service-db-secret \
            --from-literal=AWS_REGION=us-east-1 \
            --from-literal=AWS_SQS_URL="$SQS_URL" \
            --from-literal=AWS_DYNAMODB_TABLE=togglemaster-prod \
            -n analytics-service --dry-run=client -o yaml | kubectl apply -f -

          echo "✅ Todos os secrets criados!"

      - name: Run init SQL tables
        run: |
          kubectl apply -f jobs/init_sql/configmap.yaml
          kubectl delete job init-tables --ignore-not-found
          kubectl apply -f jobs/init_sql/init-tables.yaml
          kubectl wait --for=condition=complete job/init-tables --timeout=120s || true
          echo "✅ Tabelas criadas!"

      - name: Final Status
        run: |
          echo "=== Nodes ==="
          kubectl get nodes
          echo "=== ArgoCD Apps ==="
          kubectl get applications -n argocd
          echo "=== Pods ==="
          kubectl get pods -A | grep -E "service|argocd|monitoring"
